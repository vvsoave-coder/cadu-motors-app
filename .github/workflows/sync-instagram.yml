name: Sync Instagram (manual / backup)

# O agendamento automático a cada 20 min foi migrado pro cron-job.org
# (o schedule do GitHub Actions não é confiável para intervalos curtos —
# historicamente rodava a cada 2-5h em vez de 20 min). Mantido aqui só
# como disparo manual de backup pela aba Actions.
on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/sync-instagram
        run: |
          curl -sf -X POST "${{ secrets.SITE_URL }}/api/sync-instagram" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -o response.json -w "HTTP %{http_code}\n"
          cat response.json
